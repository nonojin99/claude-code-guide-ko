<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Code 슬래시(/) 명령 가이드</title>
<script src="marked.min.js"></script>
<style>
  :root { --ink:#1f2328; --muted:#59636e; --line:#d8dee4; --bg:#ffffff; --side:#f6f8fa; --accent:#c15f3c; --code:#f3f1ee; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Pretendard", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color:var(--ink); background:var(--bg); line-height:1.7; }
  .wrap { display:flex; min-height:100vh; }
  nav { width:260px; flex-shrink:0; background:var(--side); border-right:1px solid var(--line); padding:28px 20px; position:sticky; top:0; height:100vh; overflow-y:auto; }
  nav .brand { font-weight:700; font-size:15px; margin-bottom:20px; }
  nav .brand span { color:var(--accent); }
  nav a { display:block; padding:8px 10px; border-radius:6px; color:var(--ink); text-decoration:none; font-size:14px; }
  nav a:hover { background:#eaeef2; }
  nav a.on { background:#fff; box-shadow:inset 3px 0 0 var(--accent); font-weight:600; }
  main { flex:1; min-width:0; padding:40px 48px 80px; max-width:860px; }
  h1 { font-size:28px; margin:0 0 16px; } h2 { font-size:20px; margin:36px 0 12px; padding-bottom:6px; border-bottom:1px solid var(--line); }
  a { color:#0b62c4; }
  code { background:var(--code); padding:1px 6px; border-radius:4px; font-size:.92em; font-family: ui-monospace, "SF Mono", Consolas, monospace; }
  pre { background:#24292f; color:#f0f3f6; padding:16px; border-radius:8px; overflow-x:auto; }
  pre code { background:none; padding:0; color:inherit; }
  table { border-collapse:collapse; width:100%; margin:12px 0; font-size:14px; display:block; overflow-x:auto; }
  th, td { border:1px solid var(--line); padding:8px 10px; text-align:left; vertical-align:top; }
  th { background:var(--side); white-space:nowrap; }
  blockquote { margin:16px 0; padding:10px 16px; border-left:4px solid var(--accent); background:#fbf6f3; color:var(--muted); }
  blockquote p { margin:0; }
  .err { color:#b42318; }
  .toggle { display:none; }
  @media (max-width: 760px) {
    .wrap { display:block; }
    nav { width:auto; height:auto; position:static; border-right:none; border-bottom:1px solid var(--line); padding:14px 16px; }
    nav .links { display:none; } nav.open .links { display:block; }
    .toggle { display:inline-block; float:right; border:1px solid var(--line); background:#fff; border-radius:6px; padding:2px 10px; font-size:13px; }
    nav .brand { margin:0; }
    main { padding:24px 18px 60px; }
    h1 { font-size:23px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <nav id="nav">
    <button class="toggle" onclick="document.getElementById('nav').classList.toggle('open')">목차</button>
    <div class="brand">Claude Code <span>/</span> 가이드</div>
    <div class="links" id="links"></div>
  </nav>
  <main id="content">불러오는 중…</main>
</div>
<script>
const PAGES = [
  { id: "home", title: "개요 · 치트시트", file: "README.md" },
  { id: "01", title: "1. 처음 시작하기", file: "docs/01-getting-started.md" },
  { id: "02", title: "2. 작업 단계별 명령", file: "docs/02-commands-by-stage.md" },
  { id: "03", title: "3. CLAUDE.md와 스킬", file: "docs/03-claude-md-and-skills.md" },
  { id: "04", title: "4. 훅(Hooks)", file: "docs/04-hooks.md" },
  { id: "05", title: "5. 믿고 맡기는 검증 루프", file: "docs/05-verification-loop.md" },
];
const byFile = Object.fromEntries(PAGES.map(p => [p.file.split("/").pop(), p.id]));

document.getElementById("links").innerHTML =
  PAGES.map(p => `<a href="#${p.id}" data-id="${p.id}">${p.title}</a>`).join("");

// 문서 사이 상대 링크(.md)를 이 페이지 안의 해시 주소로 바꾼다
function relink(root) {
  root.querySelectorAll("a[href]").forEach(a => {
    const href = a.getAttribute("href");
    if (/^https?:/.test(href) || href.startsWith("#")) { if (/^https?:/.test(href)) a.target = "_blank"; return; }
    const name = href.split("/").pop();
    if (byFile[name]) a.setAttribute("href", "#" + byFile[name]);
  });
}

async function show() {
  const id = location.hash.slice(1) || "home";
  const page = PAGES.find(p => p.id === id) || PAGES[0];
  document.querySelectorAll("#links a").forEach(a => a.classList.toggle("on", a.dataset.id === page.id));
  document.getElementById("nav").classList.remove("open");
  const main = document.getElementById("content");
  try {
    const res = await fetch(page.file, { cache: "no-cache" });
    if (!res.ok) throw new Error(res.status);
    main.innerHTML = marked.parse(await res.text());
    relink(main);
    document.title = page.title + " — Claude Code 가이드";
    window.scrollTo(0, 0);
  } catch (e) {
    main.innerHTML = `<p class="err">문서를 불러오지 못했어요 (${page.file}). <a href="https://github.com/nonojin99/claude-code-guide-ko">GitHub에서 보기</a></p>`;
  }
}
window.addEventListener("hashchange", show);
show();
</script>
</body>
</html>
